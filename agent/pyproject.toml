[project]
name = "flowboard-agent"
version = "1.3.0"
description = "Flowboard local agent: FastAPI + SQLite + extension bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
# Scope collection to the real suite. Root-level `_*.py` scratch/probe
# scripts (manual live-Flow debugging helpers) live alongside this file
# and some match pytest's default `*_test.py` pattern, which made a bare
# `pytest` crash at collection instead of running the suite.
testpaths = ["tests"]
